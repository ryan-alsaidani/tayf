name: Build Tayf

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Make fetch script executable
        run: chmod +x tools/fetch_assets.sh

      - name: Fetch OCR models and font if missing
        run: bash tools/fetch_assets.sh

      - name: Prepare release keystore (optional)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE_SECRET: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_B64" ]; then
            if echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null && [ -s "$RUNNER_TEMP/release.keystore" ]; then
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
              echo "Keystore loaded from KEYSTORE_BASE64."
            else
              echo "Keystore secret is not valid base64; continuing without release signing." >&2
            fi
          elif [ -n "${KEYSTORE_FILE_SECRET}" ]; then
            if echo "${KEYSTORE_FILE_SECRET}" | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null && [ -s "$RUNNER_TEMP/release.keystore" ]; then
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
              echo "Keystore loaded from KEYSTORE_FILE."
            else
              echo "KEYSTORE_FILE secret is unusable; continuing with debug signing." >&2
            fi
          else
            echo "No keystore secret configured; using debug signing."
          fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: tayf-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/
            build/reports/
          if-no-files-found: ignore
